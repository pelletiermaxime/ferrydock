name: macOS checks and packages

on:
  workflow_call:
    inputs:
      build-packages:
        description: Build and verify the macOS app and DMG
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  MACOSX_DEPLOYMENT_TARGET: "15.0"

jobs:
  package:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check runner architecture
        run: test "$(uname -m)" = arm64
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --target aarch64-apple-darwin
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-arm64
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --lib --locked --target aarch64-apple-darwin
      - name: Build release binary
        if: inputs.build-packages
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Package and verify ad hoc signed app and DMG
        if: inputs.build-packages
        id: package
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.build-packages
        with:
          name: macos-arm64-packages
          path: |
            ${{ steps.package.outputs.dmg }}
            target/packages/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
