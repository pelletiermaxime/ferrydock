name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  tests:
    name: Release checks
    uses: ./.github/workflows/ci.yml

  package:
    name: Linux packages
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version and notes
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match Cargo version {version}")
          if not pathlib.Path(f"docs/releases/{tag}.md").is_file():
              raise SystemExit(f"Missing release notes for {tag}")
          PY
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang dpkg-dev \
            libssl-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libfreetype-dev \
            libxcb1-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-x86_64
      - name: Build release binary
        run: cargo build --release --locked
      - name: Create packages and checksums
        run: bash scripts/package-linux.sh "$GITHUB_REF_NAME"
      - name: Test package installation in Ubuntu
        run: |
          docker run --rm -v "$PWD/target/packages:/packages:ro" ubuntu:24.04 bash -euc '
            apt-get update
            apt-get install -y /packages/ferrydock_*.deb
            test -f /usr/share/applications/dev.ferrydock.FerryDock.desktop
            test -f /usr/share/doc/ferrydock/copyright
            set +e
            ferrydock 2>/tmp/startup-error
            status=$?
            set -e
            test "$status" -eq 1
            grep -F "FerryDock needs a Wayland (WAYLAND_DISPLAY) or X11 (DISPLAY) desktop connection" /tmp/startup-error
            mkdir /tmp/archive
            tar -xzf /packages/ferrydock-*-linux-x86_64.tar.gz -C /tmp/archive
            set +e
            /tmp/archive/ferrydock-*-linux-x86_64/ferrydock 2>/tmp/archive-error
            status=$?
            set -e
            test "$status" -eq 1
            grep -F "FerryDock needs a Wayland (WAYLAND_DISPLAY) or X11 (DISPLAY) desktop connection" /tmp/archive-error
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: target/packages/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "FerryDock $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
