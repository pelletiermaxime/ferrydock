name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/build-website.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "scripts/build-website.py"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Prepare static site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release tags can predate website changes; publish the current main site.
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
      - name: Read current release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/pelletiermaxime/ferrydock/releases/latest > "$RUNNER_TEMP/release.json"
      - name: Prepare website
        run: python3 scripts/build-website.py --release "$RUNNER_TEMP/release.json" --output .verification/website/dist
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: .verification/website/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
