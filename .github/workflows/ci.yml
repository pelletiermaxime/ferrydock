name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  macos:
    name: macOS checks and packages
    uses: ./.github/workflows/macos.yml

  tests:
    name: Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang \
            libssl-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libfreetype-dev \
            libxcb1-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libegl1 mesa-vulkan-drivers
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-x86_64
          cache-on-failure: true
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Verification helper regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --lib --locked
      - name: Docker integration tests
        run: bash scripts/verify-docker.sh
      - name: Compose project integration tests
        run: bash scripts/verify-compose.sh
      - name: Images integration tests
        run: bash scripts/verify-images.sh
      - name: Image analysis integration tests
        run: bash scripts/verify-image-analysis.sh
      - name: Image prune API tests (isolated socket fixture)
        run: cargo test --locked --test images_prune
      - name: Volume sizes API tests (isolated socket fixture)
        run: cargo test --locked --test volume_sizes
      - name: Volume prune API tests (isolated socket fixture)
        run: cargo test --locked --test volumes_prune
      - name: Volumes integration tests
        run: bash scripts/verify-volumes.sh
      - name: Headless UI tests
        run: python3 scripts/verify-headless.py --timeout 900
      - name: Headless image analysis UI tests
        run: python3 scripts/verify-headless.py --flow analysis --timeout 900
      - name: Retain headless test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headless-ui-evidence
          path: .verification/headless/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain Compose test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-project-evidence
          path: .verification/compose/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain Images test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-evidence
          path: .verification/images/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain Volumes test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: volumes-evidence
          path: .verification/volumes/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain image analysis test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-analysis-evidence
          path: .verification/image-analysis/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
