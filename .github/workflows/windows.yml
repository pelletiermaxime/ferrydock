name: Windows preview packages

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  package:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --target x86_64-pc-windows-msvc
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-x86_64
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: Unit tests and isolated named-pipe API fixtures
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc
      - name: Package regression tests
        run: python -m unittest discover -s tests -p test_windows_package.py -v
      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package and inspect Windows preview
        run: python scripts/package-windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64-packages
          path: |
            target/packages/ferrydock-*-windows-x86_64.zip
            target/packages/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-package-check
          path: target/packages/windows-package-check.json
          if-no-files-found: ignore
          retention-days: 7
