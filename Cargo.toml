[package]
name = "ferrydock"
version = "0.15.1"
edition = "2024"
license = "MIT"
description = "A small native Docker workbench built with Rust and GPUI"

[workspace]
members = ["crates/image-analysis-core", "crates/ferrydock-dev"]
resolver = "3"

[dependencies]
image-analysis-core = { path = "crates/image-analysis-core" }
tempfile = "3"
alacritty_terminal = "0.26.0"
anyhow = "1"
env_logger = { version = "0.11", default-features = false, optional = true }
bollard = "0.21.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures-util = "0.3"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = "0.1.21"
# GPUI Kit and direct engine consumers must share its selected Fast backend.
gpui-kit = { version = "0.8.0", features = ["gpui-fast", "tree-sitter"] }
gpui = { package = "gpui-fast", version = "0.1.10", default-features = false, features = ["wayland", "x11", "windows-manifest-provided-by-host"] }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.10", default-features = false, features = ["font-kit", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Reuse Bollard's HTTP transport packages to decode both Docker disk-usage
# response formats; its generated model only understands the newer format.
[target.'cfg(unix)'.dependencies]
hyperlocal = { version = "0.9.1", default-features = false, features = ["client"] }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
ring = "0.17.14"
semver = "1.0.28"

[target.'cfg(windows)'.dependencies]
hex = "0.4.3"
hyper-named-pipe = "0.1.1"

[build-dependencies]
embed-resource = "3.0.12"

[features]
headless-tests = ["gpui/test-support", "gpui-kit/test-support"]
hot-reload = ["gpui/hot-reload", "dep:env_logger"]

[profile.dev]
debug = 0

# Layout runs for every live log frame. GPUI instantiates Taffy's generic layout
# code, so optimize both while leaving application code fast to compile.
[profile.dev.package.gpui-fast]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

# Optimize stable image dependencies while keeping FerryDock quick to rebuild.
[profile.dev.package.image]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
