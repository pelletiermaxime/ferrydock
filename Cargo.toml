[package]
name = "ferrydock"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small native Docker workbench built with Rust and GPUI"

[dependencies]
alacritty_terminal = "=0.26.0"
anyhow = "1"
bollard = "=0.21.1"
futures-util = "0.3"
# Keep the GPUI crates on one immutable community-edition revision. This revision
# includes Linux offscreen GPU rendering; headless test support is opt-in below.
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "43dacc568497c615c55a1ea0f77ab381c0d9865b", default-features = false, features = ["x11", "windows-manifest"] }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce", rev = "43dacc568497c615c55a1ea0f77ab381c0d9865b", default-features = false, features = ["font-kit", "x11"] }
gpui_wgpu = { package = "gpui_ce_wgpu", git = "https://github.com/gpui-ce/gpui-ce", rev = "43dacc568497c615c55a1ea0f77ab381c0d9865b", optional = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[features]
headless-tests = ["gpui/test-support", "gpui_platform/test-support", "dep:gpui_wgpu", "dep:image"]

[profile.dev]
debug = 0

# PNG readback is part of the development verification loop. Optimize these
# stable dependencies while keeping FerryDock itself quick to rebuild.
[profile.dev.package.image]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
