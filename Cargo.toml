[package]
name = "ferrydock"
version = "0.11.1"
edition = "2024"
license = "MIT"
description = "A small native Docker workbench built with Rust and GPUI"

[workspace]
members = ["crates/image-analysis-core"]
resolver = "3"

[dependencies]
image-analysis-core = { path = "crates/image-analysis-core" }
tempfile = "3"
alacritty_terminal = "=0.26.0"
anyhow = "1"
bollard = "=0.21.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
futures-util = "0.3"
# GPUI Kit and direct engine consumers must share its selected Fast backend.
gpui-kit = { version = "=0.7.3", features = ["gpui-fast", "tree-sitter"] }
gpui = { package = "gpui-fast", version = "=0.1.7", default-features = false, features = ["wayland", "x11", "windows-manifest-provided-by-host"] }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.7", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_wgpu = { package = "gpui-fast-wgpu", version = "=0.1.7", optional = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Reuse Bollard's HTTP transport packages to decode both Docker disk-usage
# response formats; its generated model only understands the newer format.
[target.'cfg(unix)'.dependencies]
http-body-util = "=0.1.5"
hyper = "=1.12.0"
hyper-util = "=0.1.21"
hyperlocal = { version = "=0.9.1", default-features = false, features = ["client"] }

[features]
headless-tests = ["gpui/test-support", "gpui-kit/test-support", "gpui_platform/test-support", "dep:gpui_wgpu", "dep:image"]

[profile.dev]
debug = 0

# Layout runs for every live log frame. GPUI instantiates Taffy's generic layout
# code, so optimize both while leaving application code fast to compile.
[profile.dev.package.gpui-fast]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

# PNG readback is part of the development verification loop. Optimize these
# stable dependencies while keeping FerryDock itself quick to rebuild.
[profile.dev.package.image]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
