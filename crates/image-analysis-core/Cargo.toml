[package]
name = "image-analysis-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded offline Docker archive layer metadata and waste analysis"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
flate2 = "1"
zstd = { version = "0.14.2", default-features = false }
